name: survey_pro
description: Survey GT 工程测量工具箱，支持坐标、导线、曲线、水准、土方与离线成果导出。
publish_to: none
version: 1.0.0+23140

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  csv: 6.0.0
  ffi: ^2.1.4
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.3
  survey_core:
    path: ../packages/survey_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/survey/NotoSansSC-OFL.txt
    - assets/fonts/survey/JetBrainsMono-OFL.txt
  fonts:
    - family: Noto Sans SC
      fonts:
        - asset: assets/fonts/survey/NotoSansSC.ttf
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/survey/JetBrainsMono.ttf
