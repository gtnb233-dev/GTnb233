[package]
name = "survey_rust_core"
version = "0.1.0"
edition = "2021"
description = "High-performance Rust compute kernel for Survey Pro (DXF parser, TIN earthwork, spatial point index)"
license = "MIT"

[lib]
name = "survey_rust_core"
crate-type = ["cdylib", "staticlib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
